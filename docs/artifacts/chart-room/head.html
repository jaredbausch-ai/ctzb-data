<title>CTZB Chart Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a chart terminal. Chart picker on top, price over CT RSI, and the trade card slides in from the right (bottom sheet on a phone) when a marker is clicked. One deliberate dark look. */
:root{
  --void:#0b0f12; --panel:#131a1e; --panel2:#182025; --rule:#26313a; --ink:#e6ecef; --dim:#8e9ca5;
  --ok:#53c18b; --warn:#d9a64a; --bad:#e2766a; --ct:#9d7cf0; --sig:#e39a4a;
  --gAp:#22a06b; --gA:#3b82c4; --gB:#7b8794; --gC:#4b5560; --form:#f2c14e;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--sans);margin:0;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:8px;box-sizing:border-box}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--mono);font-weight:600;letter-spacing:.08em;font-size:13px}
.brand small{color:var(--dim);font-weight:400;letter-spacing:.04em;margin-left:8px}
.picker{display:flex;flex-wrap:wrap;gap:4px}
.picker button{font:500 12px var(--mono);color:var(--dim);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:5px 8px;cursor:pointer}
.picker button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.picker button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--form);margin-left:5px;vertical-align:1px}
.picker button:focus-visible,.close:focus-visible,.copy:focus-visible{outline:2px solid var(--form);outline-offset:1px}
.live{font:500 11px var(--mono);color:var(--dim);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;background:var(--panel)}
.live b{color:var(--ink);font-weight:600}
.live.on{border-color:color-mix(in srgb,var(--ok) 55%,var(--rule))}
.live.off{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--dim);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px}
.stage{flex:1;min-height:0;display:flex;gap:8px}
.charts{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;position:relative}
#price{flex:3;min-height:0;border:1px solid var(--rule);border-radius:6px 6px 0 0;overflow:hidden}
#osc{flex:1.15;min-height:0;border:1px solid var(--rule);border-radius:0 0 6px 6px;overflow:hidden;position:relative}
.tag{position:absolute;left:10px;top:6px;z-index:3;font:500 11px var(--mono);color:var(--dim);pointer-events:none}
.hint{position:absolute;right:10px;top:8px;z-index:3;font-size:11px;color:var(--dim);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 7px;border-radius:4px;pointer-events:none}
.card{width:380px;flex:none;background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:auto;display:flex;flex-direction:column}
.card[hidden]{display:none!important}
.ch{padding:14px 14px 10px;position:relative;display:flex;flex-direction:column;gap:6px}
.ch .n{position:absolute;right:40px;top:12px;font:11px var(--mono);color:var(--dim);text-align:right;line-height:1.35}
.ch .n b{display:block;font-size:15px;color:var(--ink);font-weight:500}
.close{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:4px;border:1px solid var(--rule);background:var(--panel2);color:var(--dim);font-size:15px;cursor:pointer;line-height:1}
.word{font:600 21px var(--mono);letter-spacing:.03em;padding-right:120px;line-height:1.25}
.chip{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:3px;color:#fff;letter-spacing:.04em}
.line{color:var(--dim);font-size:13px;line-height:1.5}
.line b{color:var(--ink);font-weight:500}
.head{display:flex;align-items:baseline;gap:12px;padding:12px 14px;border-top:1px solid var(--rule);background:var(--panel2)}
.big{font:600 44px var(--mono);line-height:1;font-variant-numeric:tabular-nums}
.big-k{font-size:13px;line-height:1.4}
.big-k span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
.grid div{background:var(--panel);padding:9px 10px;min-width:0}
.v{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-top:3px;line-height:1.3}
.gd{color:var(--ok)}.wn{color:var(--warn)}.bd{color:var(--bad)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
.split div{background:var(--panel);padding:9px 10px}
.lad{border-top:1px solid var(--rule);padding:10px 12px}
.lad h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:500}
.lad table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
.lad th,.lad td{padding:4px 3px;text-align:right;border-bottom:1px solid var(--rule)}
.lad th{color:var(--dim);font-weight:400;font-size:10.5px}
.lad th:first-child,.lad td:first-child{text-align:left}
.foot{padding:11px 14px;border-top:1px solid var(--rule);background:var(--panel2);color:var(--dim);font-size:12px;line-height:1.55;display:flex;flex-direction:column;gap:8px}
.foot b{color:var(--ink);font-weight:500}
.cp{display:flex;gap:6px;align-items:center}
.cp code{flex:1;min-width:0;font:11px var(--mono);color:var(--ink);background:var(--void);border:1px solid var(--rule);border-radius:4px;padding:5px 7px;overflow-x:auto;white-space:nowrap}
.copy{font:500 11px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:5px 8px;cursor:pointer}
.yes{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.sample{font-size:11px;color:var(--warn);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:820px){
  body{overflow:auto}
  .stage{flex-direction:column}
  .charts{min-height:62vh}
  .card{width:auto;max-height:none}
  .legend{margin-left:0}
  .word{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateX(12px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<div class="app">
  <div class="bar">
    <div class="brand">CTZB CHART ROOM<small>signals and cards as of <span id="asof"></span></small></div>
    <div class="live" id="live" role="status">Live price: connecting…</div>
    <div class="picker" id="picker" role="group" aria-label="Chart"></div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--gAp)"></i>A+</span><span><i style="background:var(--gA)"></i>A</span>
      <span><i style="background:var(--gB)"></i>B</span><span><i style="background:var(--gC)"></i>C</span>
      <span><i style="background:var(--form)"></i>forming</span>
    </div>
  </div>
  <div class="stage">
    <div class="charts">
      <div class="tag" id="ptag"></div>
      <div class="hint">Click a marker for its card</div>
      <div id="price"></div>
      <div id="osc"><div class="tag">CT RSI 14 · Signal 14 · zones 40 / 50 / 60</div></div>
    </div>
    <aside class="card" id="card" aria-live="polite"></aside>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
