name: Fetch candles

on:
  schedule:
    # 4 Nov 2026: GitHub's scheduler is best-effort and was honouring roughly one
    # in three of our ticks (4 Nov: 2 of the 5 due by 18:40 UTC fired, one 3h51m
    # late). One tick per candle is not enough for a paid product. The job now
    # ticks every 30 minutes at off-peak minutes (GitHub drops the most ticks at
    # the top of the hour) plus once 7 minutes after the daily close, and the
    # gate job below exits in seconds when this 4-hour candle is already in. So
    # any single honoured tick inside a 4-hour window is enough.
    - cron: "7 0 * * *"
    - cron: "13,43 * * * *"
  workflow_dispatch:

concurrency:
  group: candles
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: g
        run: |
          now=$(date -u +%s); boundary=$(( now / 14400 * 14400 ))
          last=$(git log -1 --format=%ct --grep='candles through' || true)
          echo "last candle commit $(date -u -d @${last:-0} '+%Y-%m-%d %H:%M') UTC; current candle opened $(date -u -d @$boundary '+%H:%M') UTC"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${last:-0}" -ge "$((boundary + 300))" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "already have this candle, skipping"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and resample
        run: python fetch.py

      - name: Rescore dashboard datasets
        run: python refresh.py --data data --out datasets

      # Conviction grade (analysis/grade.py defines it; this applies it):
      # writes datasets/grades.csv and adds grade columns to forward.csv and
      # live.csv. Must never block the candle commit.
      - name: Grade signals
        continue-on-error: true
        run: |
          pip install -q numpy
          python grade_live.py

      # The whole stack (stack_live.py, 28 Oct 2026): every documented read
      # evaluated against every forming low and every open signal, plus every
      # print and every open confluence window. Its coverage check fails if a
      # PRETRADE read is not in the registry. Does not block the candle commit,
      # but the last step turns the run red so the failure is emailed.
      - name: Live stack (every documented read)
        id: stack
        continue-on-error: true
        run: python stack_live.py

      # Independent cross-check of every trade card against the trade ledger
      # (verify_cards.py, 28 Oct 2026). A mismatch turns the run red.
      - name: Cross-check the trade cards
        id: cards
        continue-on-error: true
        run: python verify_cards.py

      # The live feed (feed_live.py, 31 Oct 2026): one versioned JSON that
      # repackages this run's datasets for Joe's side (backend, portal, Grok).
      # Cards are withheld if the stack or card check failed. Must not block
      # the candle commit.
      - name: Write the live feed
        continue-on-error: true
        run: python feed_live.py

      # Perp open interest, funding and long/short ratio from Coinalyze.
      # Needs the repository secret COINALYZE_API_KEY; skips cleanly without it.
      # A failure here must not block the candle commit below.
      - name: Fetch Coinbase Premium (no key needed)
        run: python fetch_flows.py

      - name: Fetch stablecoin supply and ETF flows (no key needed)
        run: python fetch_onchain.py

      - name: Fetch derivatives positioning
        continue-on-error: true
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python fetch_derivs.py

      - name: Commit if anything changed
        run: |
          git config user.name  "ctzb-pipeline"
          git config user.email "actions@github.com"
          git add data/ datasets/ feed/ analysis/registry.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "candles through $(date -u +%Y-%m-%d)"
            # pcr.yml also pushes; retry with a rebase if it got there first.
            # --autostash: a stray modified file must never block the push (31 Oct-1 Nov:
            # an uncommitted registry.json blocked every push while the step reported success).
            pushed=no
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q && git push; then pushed=yes; break; fi
              sleep $((i * 15))
            done
            if [ "$pushed" != yes ]; then echo "PUSH FAILED after 5 tries"; exit 1; fi
          fi

      - name: Fail the run if the live stack or the card check failed
        if: steps.stack.outcome == 'failure' || steps.cards.outcome == 'failure'
        run: |
          cat datasets/stack_status.txt || true
          echo "stack_live.py failed: a documented read is not being checked live"
          exit 1
