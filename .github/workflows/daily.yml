name: Fetch candles

on:
  schedule:
    # GitHub's scheduled runs are best-effort and can be hours late: the
    # 17 Oct run landed at 05:41 UTC against a 01:20 schedule, after the
    # dashboard task had already looked. Running every four hours means a
    # delayed run costs little, since the commit step is a no-op when
    # nothing changed.
    # Every candle on every chart closes at 00:00 UTC (8 PM ET in summer, 7 PM
    # in winter). The first run of the day fires 7 minutes after that close so
    # a confirmation is scored as soon as the bar is final (changed 28 Oct
    # 2026); the other five keep the four-hour cadence.
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and resample
        run: python fetch.py

      - name: Rescore dashboard datasets
        run: python refresh.py --data data --out datasets

      # Conviction grade (analysis/grade.py defines it; this applies it):
      # writes datasets/grades.csv and adds grade columns to forward.csv and
      # live.csv. Must never block the candle commit.
      - name: Grade signals
        continue-on-error: true
        run: |
          pip install -q numpy
          python grade_live.py

      # The whole stack (stack_live.py, 28 Oct 2026): every documented read
      # evaluated against every forming low and every open signal, plus every
      # print and every open confluence window. Its coverage check fails if a
      # PRETRADE read is not in the registry. Does not block the candle commit,
      # but the last step turns the run red so the failure is emailed.
      - name: Live stack (every documented read)
        id: stack
        continue-on-error: true
        run: python stack_live.py

      # Independent cross-check of every trade card against the trade ledger
      # (verify_cards.py, 28 Oct 2026). A mismatch turns the run red.
      - name: Cross-check the trade cards
        id: cards
        continue-on-error: true
        run: python verify_cards.py

      # Perp open interest, funding and long/short ratio from Coinalyze.
      # Needs the repository secret COINALYZE_API_KEY; skips cleanly without it.
      # A failure here must not block the candle commit below.
      - name: Fetch Coinbase Premium (no key needed)
        run: python fetch_flows.py

      - name: Fetch stablecoin supply and ETF flows (no key needed)
        run: python fetch_onchain.py

      - name: Fetch derivatives positioning
        continue-on-error: true
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python fetch_derivs.py

      - name: Commit if anything changed
        run: |
          git config user.name  "ctzb-pipeline"
          git config user.email "actions@github.com"
          git add data/ datasets/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "candles through $(date -u +%Y-%m-%d)"
            # pcr.yml also pushes; retry with a rebase if it got there first
            for i in 1 2 3 4 5; do
              git pull --rebase -q && git push && break
              sleep $((i * 15))
            done
          fi

      - name: Fail the run if the live stack or the card check failed
        if: steps.stack.outcome == 'failure' || steps.cards.outcome == 'failure'
        run: |
          cat datasets/stack_status.txt || true
          echo "stack_live.py failed: a documented read is not being checked live"
          exit 1
