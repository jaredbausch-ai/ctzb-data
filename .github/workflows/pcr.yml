name: Options put/call (Deribit)

# Builds data/options/ from Deribit's free trade history. Every 3 hours, each
# run backfilling for up to 5 hours until history reaches 2016/2019 (GitHub's
# hourly schedule proved unreliable: 2 runs in 8 hours on 28 Oct), then each run is a quick forward fill plus the
# daily open-interest snapshot. Its own concurrency group: it must NOT share one
# with the candle job, because GitHub cancels a pending run when a newer run
# joins the same group, and the hourly runs here would cancel candle runs.
# Both jobs rebase and retry their push instead.
on:
  # 10 Nov 2026: GitHub's own cron removed. The Cloudflare scheduler Worker
  # (cloudflare/ctzb-scheduler-worker.js) dispatches this every 3 hours at :25.
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_pcr.py, .github/workflows/pcr.yml]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: pcr
  cancel-in-progress: false

jobs:
  pcr:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch put/call (forward fill, OI snapshot, then backfill for up to 5 hours)
        id: fetch
        continue-on-error: true
        run: timeout 310m python fetch_pcr.py --budget 18000

      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name  "ctzb-pipeline"
          git config user.email "actions@github.com"
          git add data/options/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "options put/call through $(date -u +%Y-%m-%d)"
            # 4 Nov 2026: same fix as the candle job (1 Nov). Without --autostash and an
            # exit on failure, a blocked push was silent and the run still went green.
            pushed=no
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q && git push; then pushed=yes; break; fi
              sleep $((i * 15))
            done
            if [ "$pushed" != yes ]; then echo "PUSH FAILED after 5 tries"; exit 1; fi
          fi

      - name: Fail the run if the fetch failed (whatever it got is already committed)
        if: steps.fetch.outcome == 'failure'
        run: exit 1

  retry:
    needs: pcr
    if: always() && needs.pcr.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Re-run with cooldown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/retry_after_failure.sh pcr.yml "Put/call pipeline"

  recovered:
    needs: pcr
    if: needs.pcr.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close any open put/call alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label pipeline-alert --state open --json number,title \
                     --jq '.[] | select(.title | startswith("Put/call pipeline")) | .number' 2>/dev/null); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Recovered: put/call run $GITHUB_RUN_ID succeeded $(date -u '+%Y-%m-%d %H:%M UTC')." || true
          done
