name: Options put/call (Deribit)

# Builds data/options/ from Deribit's free trade history. Every 3 hours, each
# run backfilling for up to 5 hours until history reaches 2016/2019 (GitHub's
# hourly schedule proved unreliable: 2 runs in 8 hours on 28 Oct), then each run is a quick forward fill plus the
# daily open-interest snapshot. Its own concurrency group: it must NOT share one
# with the candle job, because GitHub cancels a pending run when a newer run
# joins the same group, and the hourly runs here would cancel candle runs.
# Both jobs rebase and retry their push instead.
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_pcr.py, .github/workflows/pcr.yml]

permissions:
  contents: write

concurrency:
  group: pcr
  cancel-in-progress: false

jobs:
  pcr:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch put/call (forward fill, OI snapshot, then backfill for up to 5 hours)
        run: python fetch_pcr.py --budget 18000

      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name  "ctzb-pipeline"
          git config user.email "actions@github.com"
          git add data/options/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "options put/call through $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase -q && git push && break
              sleep $((i * 15))
            done
          fi
