name: Pipeline watchdog

# Added 1 Nov 2026 after the candle job ran "successfully" for 19 hours without
# pushing anything (an uncommitted analysis/registry.json blocked every push).
#
# 4 Nov 2026: second line of defence only. The first line is inside each pipeline:
# any failed run re-runs itself (1 minute, then 15, then every 30 minutes; see
# .github/scripts/retry_after_failure.sh). This catches what that cannot: no run at all
# (GitHub dropping scheduled ticks). It sits on the same best-effort GitHub clock, so it
# ticks four times an hour at off-peak minutes; it had ticked hourly and fired 3 of 24
# times on 4 Nov, with a 6-hour threshold longer than the 4-hour cadence.
#
# Each tick, per pipeline: if the last data commit is older than its threshold, it
#   1. investigates (last runs, error lines from the latest),
#   2. re-runs the pipeline unless a run is already queued or running,
#   3. opens a pipeline-alert issue (or comments on the open one) and turns red, so
#      GitHub emails the owner. Closes its issue when the pipeline is fresh again.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - name: Check freshness, investigate and re-run if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          REPO="$GITHUB_REPOSITORY"; now=$(date +%s); red=0
          gh label create pipeline-alert -R "$REPO" --color B60205 --description "Data pipeline failing or stale" 2>/dev/null || true
          # name | workflow | commit message marker | stale after (minutes)
          #   candles: one missed 4-hour candle plus 45 minutes
          #   put/call: ticks every 3 hours and a run can take up to 5h20m
          for spec in "Candles|daily.yml|candles through|285" "Put/call|pcr.yml|options put/call through|540"; do
            IFS='|' read -r NAME WF MARK LIMIT <<< "$spec"
            last=$(git log -1 --format=%ct --grep="$MARK" || true); last=${last:-0}
            age=$(( (now - last) / 60 ))
            title="Pipeline stale: $NAME"
            open=$(gh issue list -R "$REPO" --label pipeline-alert --state open --json number,title \
                   --jq "[.[] | select(.title | startswith(\"$title\"))][0].number // empty" 2>/dev/null || true)
            echo "$NAME: last commit $(date -u -d @$last '+%Y-%m-%d %H:%M UTC'), $age minutes ago (limit $LIMIT)"
            if [ "$age" -lt "$LIMIT" ]; then
              [ -n "$open" ] && gh issue close "$open" -R "$REPO" --comment "Recovered: committed $(date -u -d @$last '+%Y-%m-%d %H:%M UTC')." || true
              continue
            fi
            red=1
            busy=$(gh api "repos/$REPO/actions/workflows/$WF/runs?per_page=10" \
                   --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
            {
              echo "**$NAME not committed for $age minutes** (limit $LIMIT). Last: $(date -u -d @$last '+%Y-%m-%d %H:%M UTC')."
              echo; echo "Last runs:"; echo '```'
              gh api "repos/$REPO/actions/workflows/$WF/runs?per_page=6" \
                --jq '.workflow_runs[] | "\(.created_at)  \(.event)  \(.status)/\(.conclusion)  run \(.id)"'
              echo '```'
              rid=$(gh api "repos/$REPO/actions/workflows/$WF/runs?per_page=1&status=completed" --jq '.workflow_runs[0].id')
              echo "Error lines from run $rid:"; echo '```'
              gh run view "$rid" -R "$REPO" --log 2>/dev/null \
                | grep -iE 'error|fail|rejected|traceback|exception|cannot|denied|STALE|PUSH FAILED' \
                | grep -viE 'deprecat|continue-on-error|::group' | tail -30 || echo "(no log lines matched)"
              echo '```'
            } > report.md
            if [ "${busy:-0}" -gt 0 ]; then
              echo "A $NAME run is already queued or running (or cooling down after failures): not adding another." >> report.md
            else
              gh api -X POST "repos/$REPO/actions/workflows/$WF/dispatches" -f ref=main \
                && echo "Re-ran $WF at $(date -u '+%H:%M UTC')." >> report.md
            fi
            cat report.md
            if [ -n "$open" ]; then
              # once an hour, not every tick
              [ "$(date -u +%M)" -lt 15 ] && gh issue comment "$open" -R "$REPO" --body-file report.md || true
            else
              gh issue create -R "$REPO" --label pipeline-alert --title "$title (${age} minutes)" --body-file report.md || true
            fi
          done
          exit $red
