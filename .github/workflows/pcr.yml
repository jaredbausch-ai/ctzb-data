name: Options put/call (Deribit)

# Builds data/options/ from Deribit's free trade history. Hourly until the
# backfill reaches 2016/2019, then each run is a quick forward fill plus the
# daily open-interest snapshot. Shares the "repo-writer" concurrency group with
# the candle job so the two never push over each other.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_pcr.py, .github/workflows/pcr.yml]

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  pcr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch put/call (forward fill, OI snapshot, then backfill for 35 min)
        run: python fetch_pcr.py --budget 2100

      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name  "ctzb-pipeline"
          git config user.email "actions@github.com"
          git add data/options/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "options put/call through $(date -u +%Y-%m-%d)"
            git pull --rebase -q
            git push
          fi
