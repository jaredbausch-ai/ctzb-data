name: Fetch candles

on:
  # 10 Nov 2026: GitHub's own cron is gone. It honoured about one tick in three over
  # 22 Oct-4 Nov and about one in eleven on 10 Nov. The clock is now the Cloudflare
  # Worker ctzb-scheduler, which dispatches this workflow with scheduled=true at 13 and
  # 43 minutes after each 4-hour close (00, 04, 08, 12, 16, 20 UTC). On its first 15.5
  # hours it fired 32 of 32 ticks. The 43-minute tick is the backup: the gate skips it
  # when the 13-minute run already landed the candle.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the Cloudflare scheduler. Applies the candle-already-in gate. Leave unticked for a manual run."
        type: boolean
        default: false
      test_failure:
        description: "Test only: fail on purpose to exercise the automatic re-run"
        type: boolean
        default: false

# One candle run at a time. A run waiting in its cooldown holds the group, so ticks
# queue behind it instead of hammering a source that is down.
concurrency:
  group: candles
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: g
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULED: ${{ inputs.scheduled }}
        run: |
          now=$(date -u +%s); boundary=$(( now / 14400 * 14400 ))
          last=$(git log -1 --format=%ct --grep='candles through' || true)
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?per_page=10&status=completed" \
                 --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0].conclusion' 2>/dev/null || echo unknown)
          echo "last candle commit $(date -u -d @${last:-0} '+%Y-%m-%d %H:%M') UTC; current 4h candle opened $(date -u -d @$boundary '+%H:%M') UTC; last completed run: $prev"
          # A scheduler tick (scheduled=true) is gated like a cron tick. Anything else that
          # dispatches this workflow -- a manual run, the automatic re-run after a failure,
          # the watchdog -- always runs. (10 Nov 2026: until this, every scheduler tick was
          # treated as a manual run and did the full fetch, 48 times a day.)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] && [ "$SCHEDULED" != "true" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "manual or automatic re-run: running"
          elif [ "${last:-0}" -lt "$((boundary + 300))" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "this candle is not in yet: running"
          elif [ "$prev" = "failure" ] || [ "$prev" = "timed_out" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "the last run failed: running"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "already have this candle and the last run passed: skipping"
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Test failure (only when asked for)
        if: inputs.test_failure == true
        run: |
          echo "Failing on purpose to test the automatic re-run."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `timeout` turns a hang into an ordinary step failure, which the retry job re-runs;
      # a job-level timeout would end as cancelled and skip the retry (review, 4 Nov 2026).
      - name: Fetch and resample
        run: timeout 20m python fetch.py

      # A fetch that "succeeds" with candles that stopped advancing is a failure: it is
      # retried, never committed as fresh (4 Nov 2026).
      - name: Candles must be current
        run: python .github/scripts/check_fresh.py data

      # Item 17(a), 10 Nov 2026: are the candles RIGHT, not just current? Every chart is
      # built from Coinbase 1D, so one bad daily candle corrupts every signal on it.
      # Structural faults (a missing day, low above high, a zero price or volume) fail
      # here, before the commit, so a bad fetch is retried and never committed. The
      # Kraken cross-check runs in REPORT mode until its threshold is set from its own
      # measured gap; in report mode, or when Kraken is unreachable, it never fails.
      - name: Candles must be sane, and agree with a second exchange
        run: timeout 5m python .github/scripts/check_candles.py data --out datasets/candle_check.json

      # Must not block the candle commit (review, 4 Nov 2026): a code error here used to
      # leave fresh candles uncommitted. A failure turns the run red after the commit.
      - name: Rescore dashboard datasets
        id: refresh
        continue-on-error: true
        run: timeout 10m python refresh.py --data data --out datasets

      # Conviction grade (analysis/grade.py defines it; this applies it):
      # writes datasets/grades.csv and adds grade columns to forward.csv and
      # live.csv. Must never block the candle commit; a failure turns the run red
      # at the end, which triggers the automatic re-run.
      - name: Grade signals
        id: grade
        continue-on-error: true
        run: |
          pip install -q numpy
          timeout 10m python grade_live.py

      # Member card figures (extras_live.py, 11 Nov 2026, item 18): the miss stat,
      # the past-signal paths and the odds-fade marks, from this run's ledger.
      # Never blocks anything; if it fails, the feed withholds just these fields.
      - name: Member card figures
        id: extras
        continue-on-error: true
        run: timeout 5m python extras_live.py

      # The whole stack (stack_live.py, 28 Oct 2026): every documented read
      # evaluated against every forming low and every open signal, plus every
      # print and every open confluence window. Its coverage check fails if a
      # PRETRADE read is not in the registry.
      - name: Live stack (every documented read)
        id: stack
        continue-on-error: true
        run: timeout 15m python stack_live.py

      # Independent cross-check of every trade card against the trade ledger
      # (verify_cards.py, 28 Oct 2026).
      - name: Cross-check the trade cards
        id: cards
        continue-on-error: true
        run: timeout 10m python verify_cards.py

      # Regression guard (tests/regression.py, 9 Nov 2026, item 17c): every run
      # re-derives the whole ledger, so a lens, grade or engine bug shows up as a
      # PAST signal changing value. A CSV diff cannot see it, because the same run
      # also appends new signals and moves the cohort aggregates. This compares each
      # signal against tests/baseline/ledger.json and fails on any change to a row
      # that should be frozen. An intended change is re-baselined with --approve and
      # committed, so it lands in the diff where someone can review it.
      - name: Grade and lens regression guard
        id: regress
        continue-on-error: true
        run: timeout 5m python tests/regression.py

      # The live feed (feed_live.py, 31 Oct 2026): one versioned JSON that
      # repackages this run's datasets for Joe's side. Cards are withheld if the
      # stack or card check failed.
      - name: Write the live feed
        id: feed
        continue-on-error: true
        # Item 17d: cards AND alerts are withheld if any of these failed this run.
        env:
          CTZB_STEP_OUTCOMES: "refresh=${{ steps.refresh.outcome }},grade=${{ steps.grade.outcome }},stack=${{ steps.stack.outcome }},cards=${{ steps.cards.outcome }},regress=${{ steps.regress.outcome }},extras=${{ steps.extras.outcome }}"
        run: timeout 5m python feed_live.py

      # Third-party sources. 4 Nov 2026: flows and on-chain used to run without
      # continue-on-error BEFORE the commit, so an outage at one of those sources
      # blocked the candle commit itself. None of them may block the candles now;
      # any failure turns the run red at the end and is re-run automatically.
      - name: Fetch Coinbase Premium (no key needed)
        id: flows
        continue-on-error: true
        run: timeout 10m python fetch_flows.py

      - name: Fetch stablecoin supply and ETF flows (no key needed)
        id: onchain
        continue-on-error: true
        run: timeout 10m python fetch_onchain.py

      # Perp open interest, funding and long/short ratio from Coinalyze.
      # Needs the repository secret COINALYZE_API_KEY; skips cleanly without it.
      - name: Fetch derivatives positioning
        id: derivs
        continue-on-error: true
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: timeout 15m python fetch_derivs.py

      - name: Commit if anything changed
        run: |
          git config user.name  "ctzb-pipeline"
          git config user.email "actions@github.com"
          git add data/ datasets/ feed/ analysis/registry.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "candles through $(date -u +%Y-%m-%d)"
            # pcr.yml also pushes; retry with a rebase if it got there first.
            # --autostash: a stray modified file must never block the push (31 Oct-1 Nov:
            # an uncommitted registry.json blocked every push while the step reported success).
            pushed=no
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q && git push; then pushed=yes; break; fi
              sleep $((i * 15))
            done
            if [ "$pushed" != yes ]; then echo "PUSH FAILED after 5 tries"; exit 1; fi
          fi

      - name: Fail the run if any step failed (candles are already committed)
        if: >-
          steps.refresh.outcome == 'failure' ||
          steps.grade.outcome == 'failure' || steps.stack.outcome == 'failure' ||
          steps.cards.outcome == 'failure' || steps.regress.outcome == 'failure' ||
          steps.feed.outcome == 'failure' ||
          steps.flows.outcome == 'failure' || steps.onchain.outcome == 'failure' ||
          steps.derivs.outcome == 'failure'
        run: |
          echo "refresh=${{ steps.refresh.outcome }} grade=${{ steps.grade.outcome }} stack=${{ steps.stack.outcome }} cards=${{ steps.cards.outcome }} regress=${{ steps.regress.outcome }} feed=${{ steps.feed.outcome }} flows=${{ steps.flows.outcome }} onchain=${{ steps.onchain.outcome }} derivs=${{ steps.derivs.outcome }}"
          cat datasets/stack_status.txt || true
          exit 1

  # Any failure above (fetch, stale candles, push, or any step): re-run automatically.
  # 1 minute after the 1st and 2nd failure in a row, 15 minutes after the 3rd-5th, then
  # every 30 minutes until it succeeds; alert issue from the 3rd. (.github/scripts/)
  retry:
    needs: [gate, fetch]
    if: always() && (needs.fetch.result == 'failure' || needs.gate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Re-run with cooldown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/retry_after_failure.sh daily.yml "Candle pipeline"

  recovered:
    needs: [gate, fetch]
    if: needs.fetch.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close any open pipeline alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label pipeline-alert --state open --json number,title \
                     --jq '.[] | select(.title | startswith("Candle pipeline") or startswith("Pipeline stale: Candles")) | .number' 2>/dev/null); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Recovered: candle run $GITHUB_RUN_ID succeeded $(date -u '+%Y-%m-%d %H:%M UTC')." || true
          done
